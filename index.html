<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Check-in</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff;display:flex;flex-direction:column;height:100vh}
  header{padding:12px 16px;font-weight:600;display:flex;justify-content:space-between}
  #count{opacity:.7;font-weight:400}
  #stage{position:relative;flex:1;overflow:hidden;background:#000}
  video{width:100%;height:100%;object-fit:cover}
  #frame{position:absolute;inset:0;margin:auto;width:65%;aspect-ratio:1;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
  #result{padding:16px;min-height:96px;text-align:center;font-size:18px;transition:background .2s}
  #result small{display:block;opacity:.85;font-size:14px;margin-top:4px}
  .ok{background:#15803d}.dup{background:#b45309}.bad{background:#b91c1c}.wait{background:#222}
  button{margin:8px;padding:10px 16px;border:0;border-radius:8px;font-size:15px}
</style>
</head>
<body>
<header><span>Check-in scanner</span><span id="count">0 checked in</span></header>
<div id="stage"><video id="v" playsinline muted></video><div id="frame"></div></div>
<div id="result" class="wait">Starting camera…</div>
<button id="torch" hidden>Toggle flashlight</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
// ====== CONFIGURE THESE ======
const API_URL = 'https://script.google.com/macros/s/XXXX/exec'; // ends with /exec
const KEY = 'change-this-key';                              // same as SECRET in Code.gs
// =============================

const v = document.getElementById('v'), box = document.getElementById('result');
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
let busy = false, lastId = '', lastAt = 0, checkedIn = 0, track;

function show(cls, html) { box.className = cls; box.innerHTML = html; }
function beep(ok) {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator();
    o.frequency.value = ok ? 880 : 300; o.connect(a.destination); o.start(); o.stop(a.currentTime + .15);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [80, 60, 80]);
}

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    v.srcObject = stream; await v.play();
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous'))
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    if (caps.torch) {
      const t = document.getElementById('torch'); t.hidden = false;
      let on = false;
      t.onclick = () => track.applyConstraints({ advanced: [{ torch: on = !on }] });
    }
    show('wait', 'Point at a ticket QR code');
    requestAnimationFrame(tick);
  } catch (err) {
    show('bad', 'Camera blocked<small>Allow camera access and make sure the page is opened over https://</small>');
  }
}

async function tick() {
  if (v.readyState === v.HAVE_ENOUGH_DATA && !busy) {
    let text = null;
    try {
      if (detector) {
        const r = await detector.detect(v);
        if (r.length) text = r[0].rawValue;
      } else {
        const w = v.videoWidth, h = v.videoHeight;
        canvas.width = w; canvas.height = h;
        ctx.drawImage(v, 0, 0, w, h);
        const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        if (r) text = r.data;
      }
    } catch (e) {}
    if (text) handle(text.trim());
  }
  requestAnimationFrame(tick);
}

async function handle(id) {
  const now = Date.now();
  if (id === lastId && now - lastAt < 3000) return; // ignore same code re-read
  lastId = id; lastAt = now; busy = true;
  show('wait', 'Checking…');
  try {
    const res = await fetch(`${API_URL}?key=${encodeURIComponent(KEY)}&id=${encodeURIComponent(id)}`);
    const d = await res.json();
    if (d.status === 'ok') {
      checkedIn++; document.getElementById('count').textContent = checkedIn + ' checked in';
      beep(true); show('ok', `✅ ${d.name}<small>Checked in ${d.time}</small>`);
    } else if (d.status === 'duplicate') {
      beep(false); show('dup', `⚠️ Already checked in<small>${d.name} · ${d.time}</small>`);
    } else {
      beep(false); show('bad', `❌ ${d.message || 'Invalid ticket'}`);
    }
  } catch (e) {
    beep(false); show('bad', '❌ Network error<small>' + e.message + '<br>' + API_URL.slice(0, 45) + '</small>');
  }
  setTimeout(() => { busy = false; show('wait', 'Point at a ticket QR code'); }, 1500);
}
start();
</script>
</body>
</html>
